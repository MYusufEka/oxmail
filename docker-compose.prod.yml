# Production override for Oxmail
# Usage: docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds Traefik reverse proxy with automatic Let's Encrypt TLS,
# production port mappings, and TLS for mail services.

services:
  traefik:
    image: traefik:v3.0
    container_name: oxmail-traefik
    restart: always
    profiles:
      - prod
    networks:
      - oxmail-external
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt-data:/letsencrypt
    environment:
      - OXMAIL_ACME_EMAIL=${OXMAIL_ACME_EMAIL}
      - OXMAIL_DOMAIN=${OXMAIL_DOMAIN}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  postfix:
    restart: always
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
    volumes:
      - letsencrypt-data:/etc/letsencrypt:ro
    environment:
      - OXMAIL_MODE=production

  dovecot:
    restart: always
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - letsencrypt-data:/etc/letsencrypt:ro
    environment:
      - OXMAIL_MODE=production

  oxmail-api:
    restart: always
    environment:
      - OXMAIL_MODE=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oxmail-api.rule=Host(`${OXMAIL_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.oxmail-api.entrypoints=websecure"
      - "traefik.http.routers.oxmail-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oxmail-api.priority=100"
      - "traefik.http.services.oxmail-api.loadbalancer.server.port=8080"

  web:
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oxmail-web.rule=Host(`${OXMAIL_DOMAIN}`)"
      - "traefik.http.routers.oxmail-web.entrypoints=websecure"
      - "traefik.http.routers.oxmail-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.oxmail-web.loadbalancer.server.port=3000"

volumes:
  letsencrypt-data:
