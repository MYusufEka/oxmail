services:
  redis:
    image: redis:7-alpine
    container_name: oxmail-redis
    restart: unless-stopped
    networks:
      - oxmail-internal
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

  postfix:
    build:
      context: ./docker/postfix
    container_name: oxmail-postfix
    restart: unless-stopped
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_SMTP_PORT:-1025}:25"
      - "587:587"
    volumes:
      - mail-data:/var/mail
      - config-data:/etc/oxmail
      - dkim-keys:/etc/dkim
      - postfix-spool:/var/spool/postfix
    depends_on:
      redis:
        condition: service_healthy
      rspamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  dovecot:
    build:
      context: ./docker/dovecot
    container_name: oxmail-dovecot
    restart: unless-stopped
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_IMAP_PORT:-1143}:143"
    volumes:
      - mail-data:/var/mail
      - config-data:/etc/oxmail
      - postfix-spool:/var/spool/postfix
    depends_on:
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  rspamd:
    build:
      context: ./docker/rspamd
    container_name: oxmail-rspamd
    restart: unless-stopped
    networks:
      - oxmail-internal
    volumes:
      - config-data:/etc/oxmail
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M

  oxmail-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: oxmail-api
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_API_PORT:-8080}:8080"
    volumes:
      - config-data:/etc/oxmail
      - mail-data:/var/mail
      - dkim-keys:/etc/dkim
    depends_on:
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      rspamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: oxmail-web
    restart: unless-stopped
    networks:
      - oxmail-external
    ports:
      - "${OXMAIL_WEB_PORT:-3000}:3000"
    depends_on:
      oxmail-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  oxmail-internal:
    internal: true
  oxmail-external:

volumes:
  mail-data:
  config-data:
  dkim-keys:
  redis-data:
  postfix-spool:
  rspamd-data:
