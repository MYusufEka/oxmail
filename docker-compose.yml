services:
  redis:
    image: redis:7-alpine
    container_name: oxmail-redis
    restart: always
    networks:
      - oxmail-internal
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M

  postfix:
    build:
      context: ./docker/postfix
    container_name: oxmail-postfix
    restart: always
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_SMTP_PORT:-1025}:25"
      - "587:587"
    volumes:
      - mail-data:/var/mail
      - config-data:/etc/oxmail
      - dkim-keys:/etc/dkim
      - postfix-spool:/var/spool/postfix
    depends_on:
      redis:
        condition: service_healthy
      rspamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  dovecot:
    build:
      context: ./docker/dovecot
    container_name: oxmail-dovecot
    restart: always
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_IMAP_PORT:-1143}:143"
      - "110:110"
      - "995:995"
    volumes:
      - mail-data:/var/mail
      - config-data:/etc/oxmail
      - postfix-spool:/var/spool/postfix
    depends_on:
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  rspamd:
    build:
      context: .
      dockerfile: docker/rspamd/Dockerfile
    container_name: oxmail-rspamd
    env_file:
      - .env
    restart: always
    networks:
      - oxmail-internal
    volumes:
      - config-data:/etc/oxmail
      - dkim-keys:/etc/rspamd/dkim:ro
      - rspamd-data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  oxmail-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: oxmail-api
    restart: always
    env_file:
      - .env
    environment:
      - OXMAIL_MODE=dev
    networks:
      - oxmail-internal
      - oxmail-external
    ports:
      - "${OXMAIL_API_PORT:-8080}:8080"
    volumes:
      - config-data:/etc/oxmail
      - db-data:/app/data
      - mail-data:/var/mail
      - dkim-keys:/etc/dkim
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      redis:
        condition: service_healthy
      postfix:
        condition: service_healthy
      dovecot:
        condition: service_healthy
      rspamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: oxmail-web
    restart: always
    networks:
      - oxmail-external
    ports:
      - "${OXMAIL_WEB_PORT:-3000}:3000"
    depends_on:
      oxmail-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  traefik:
    image: traefik:v3.0
    container_name: oxmail-traefik
    restart: always
    profiles:
      - prod
    networks:
      - oxmail-external
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt-data:/letsencrypt
    environment:
      - OXMAIL_ACME_EMAIL=${OXMAIL_ACME_EMAIL}
      - OXMAIL_DOMAIN=${OXMAIL_DOMAIN}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  oxmail-internal:
    internal: true
  oxmail-external:

volumes:
  mail-data:
  config-data:
  db-data:
  dkim-keys:
  redis-data:
  postfix-spool:
  rspamd-data:
  letsencrypt-data:
